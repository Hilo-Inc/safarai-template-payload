name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hilo-inc/safarai-template-payload:latest
            ghcr.io/hilo-inc/safarai-template-payload:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    # Runs the pushed image as Coolify would: empty volumes, then a restart.
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/hilo-inc/safarai-template-payload:${{ github.sha }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start on empty volumes
        run: |
          docker run -d --name payload -p 3000:3000 \
            -e SERVER_URL=http://localhost:3000 -e PAYLOAD_SECRET=smoke-test-secret \
            -v payload-data:/data -v payload-media:/app/media "$IMAGE"
      - name: Wait for the admin panel
        run: |
          for i in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin) && [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker logs payload; exit 1
      - name: Home page and first user
        run: |
          curl -sf -o /dev/null http://localhost:3000/
          curl -sf -X POST http://localhost:3000/api/users/first-register -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password","name":"Smoke"}' >/dev/null
      - name: Data survives a restart
        run: |
          docker restart payload
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/admin && break; sleep 2; done
          curl -sf http://localhost:3000/api/users/init | grep -q '"initialized":true'
          curl -sf -X POST http://localhost:3000/api/users/login -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | grep -q '"token"'
      - if: failure()
        run: docker logs payload
